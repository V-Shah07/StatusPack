[project]
name = "statuspack"
version = "0.1.0"
description = "Datadog-powered status page + AI incident responder"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["statuspack*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # FastAPI uses function calls in argument defaults (Depends/Query)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
